[project]
name = "spectradesk"
version = "0.1.0"
description = "Native Linux spectroscopy workbench"
requires-python = ">=3.12"
dependencies = ["pyside6>=6.8,<7", "pyqtgraph>=0.13.7,<0.15", "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "scipy>=1.14,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
spectradesk = "spectradesk.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectradesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
